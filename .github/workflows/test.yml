name: Test

on:
  pull_request:
  push:
    branches: [main, dev]

# 测试 workflow 只需要读代码；显式声明避免继承更宽的默认权限
permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install TeX Live (texlua only)
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: true
          packages: |
            scheme-basic
            luatex

      - name: Run unit tests
        run: texlua test/run_all.lua

  regression-test:
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          cache: true
          packages: |
            scheme-basic
            latex-bin
            luatex
            luaotfload
            luatexbase
            ctablestack
            fontspec
            iftex
            geometry
            graphics
            enumitem
            environ
            trimspaces
            eso-pic
            xkeyval
            etoolbox
            l3kernel
            l3packages
            pgf
            xcolor

      # CTAN 镜像抽风时 tlmgr install 会整批下载失败，而 setup-texlive-action 仍把
      # 这份装了一半的 TeX Live 按主键存进 Actions cache；之后每次运行命中主键就跳过
      # 安装步骤，缺的宏包再也补不上，表现为几十个用例齐刷刷「Compilation failed」。
      # 这里立即验伤，把「环境缺包」和「渲染结果变了」区分开；一旦命中，
      # 需手工删掉坏缓存（gh cache list / gh cache delete <id>）再重跑。
      - name: Verify TeX Live packages
        run: kpsewhich xcolor.sty fontspec.sty pgf.sty luatexbase.sty > /dev/null

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil python3-numpy

      - name: Cache test fonts
        uses: actions/cache@v6
        with:
          path: test/fonts
          key: test-fonts-${{ hashFiles('scripts/font-manifest.json') }}

      - name: Download test fonts
        run: sh scripts/download_test_fonts.sh

      - name: Warm luaotfload font database
        # regression_test.py 并行编译多个文件；若名字数据库尚未包含
        # TW-Kai，所有 lualatex 进程会同时触发重扫并发写同一数据库，
        # 部分进程读到残缺结果导致 fontspec 随机失败。先串行建好。
        run: OSFONTDIR="$GITHUB_WORKSPACE/test/fonts" luaotfload-tool --update --force

      - name: Link luatex-cn into TEXMFHOME
        # 显式设置 TEXMFHOME（kpathsea 读取该环境变量），确保 lualatex
        # 能找到仓库里的 ltc-*.cls 与 luatex-cn 宏包
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ci-texmf/tex/lualatex"
          ln -s "$GITHUB_WORKSPACE/tex" "$GITHUB_WORKSPACE/ci-texmf/tex/lualatex/luatex-cn"
          echo "TEXMFHOME=$GITHUB_WORKSPACE/ci-texmf" >> "$GITHUB_ENV"
          kpsewhich -var-value TEXMFHOME || true

      - name: Verify class resolution
        run: kpsewhich ltc-guji.cls

      - name: Run regression tests
        run: python3 test/regression_test.py check

      - name: Run clreq assertion tests
        # 规范符合性度量断言（像素回归的盲区）：解析 PDF 内容流，
        # 断言中西间距区间、禁则、符号分离、两字宽标点等 clreq 条款
        run: python3 test/clreq_test.py

      - name: Regression summary
        # 把结果表 + 失败页差异定位写入 Actions step summary，一目了然
        if: always()
        run: python3 test/ci_regression_summary.py

      - name: Upload regression diffs
        # 失败时上传三联对比图（基线 | 当前·红框标注 | 差异热区）及原始 diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-diffs
          path: |
            test/regression_test/*/diff/
            test/regression_test/*/current/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run geometry tests
        # 不依赖基线图像的自校验：解析 PDF 内容流，断言每列字形基线等距
        # （抓「一」「丶」等按墨迹框居中导致整字偏移的 bug，LEARNING.md 3.6）
        run: python3 test/geometry_test.py

      - name: Run color key tests
        # 不依赖基线图像的自校验：断言各模块颜色 key 的两种拼法
        # （font-color/字体颜色 与 color/颜色）都真正落到 PDF 上，
        # 且未知 key 会发警告而不是被静默丢弃（issue #163）
        run: python3 test/color_test.py
