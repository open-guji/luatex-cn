% 现代蓝色线装书封面.cfg
% 现代蓝色线装书封面（中华书局、广陵书社等常见样式；参照 CY/T 247—2021《线装书籍要求》）
%
% 版式：蓝色封面 + 左上角白色书名签（细线边框，边框高度随书名字数自适应）
%       + 若干可调位置的小字（撰者／出版者等）。
%
% 提供命令：
%   \蓝签书名[键值]{书名}   书名签（高度按字数自适应）
%   \蓝签小字[键值]{文字}   封面小字（位置可调）
%   \BlueLabelTitle / \BlueLabelText  英文别名
%
% 尺寸（取 CY/T 247—2021 常见的 16 开线装本）：成品 185mm × 260mm。
% 颜色：封面藏青蓝 RGB(38,72,120)；书名签白纸黑字。在 \begin{封面}[底色={R, G, B}] 中传入。

\gujiSetup{ template = default }

\pageSetup{
    paper-width  = 370mm, % 双页展开宽度（单页 185mm）
    paper-height = 260mm,
    margin-top = 0pt,
    margin-bottom = 0pt,
    margin-left = 0pt,
    margin-right = 0pt,
}


% 书名签参数（可在导言区用 \蓝签设置 修改默认值）
\dim_new:N \l__luatexcn_bluelabel_x_dim
\dim_new:N \l__luatexcn_bluelabel_y_dim
\dim_new:N \l__luatexcn_bluelabel_fs_dim
\dim_new:N \l__luatexcn_bluelabel_g_dim
\dim_set:Nn \l__luatexcn_bluelabel_x_dim { 128mm } % 签右边缘距页面右边
\dim_set:Nn \l__luatexcn_bluelabel_y_dim { 22mm }  % 签上边缘距页面上边
\dim_set:Nn \l__luatexcn_bluelabel_fs_dim { 30pt }
\dim_set:Nn \l__luatexcn_bluelabel_g_dim { 7pt } % 框线与字之间的白边

\keys_define:nn { luatexcn / bluelabel }
  {
    x         .dim_set:N = \l__luatexcn_bluelabel_x_dim,
    y         .dim_set:N = \l__luatexcn_bluelabel_y_dim,
    font-size .dim_set:N = \l__luatexcn_bluelabel_fs_dim,
    unknown   .code:n    = { \msg_warning:nnn { luatexcn } { bluelabel-key } {#1} },
  }
\msg_new:nnn { luatexcn } { bluelabel-key } { Unknown~blue-label~key~'#1'. }

\NewDocumentCommand { \蓝签设置 } { m }
  { \keys_set:nn { luatexcn / bluelabel } {#1} }

% \蓝签书名[x=,y=,font-size=,height=]{书名}
% 边框高度 = 字数 × 字号 + 上下留白，随书名长度自动增高。
\int_new:N \l__luatexcn_bluelabel_n_int
\NewDocumentCommand { \蓝签书名 } { O{} m }
  {
    \group_begin:
      \keys_set:nn { luatexcn / bluelabel } {#1}
      \int_set:Nn \l__luatexcn_bluelabel_n_int { \tl_count:n {#2} }
      % 字格宽、总高（字数 + 上下留白）
      \dim_set:Nn \l_tmpa_dim { 1.3 \l__luatexcn_bluelabel_fs_dim }
      \dim_set:Nn \l_tmpb_dim
        { \fp_eval:n { \l__luatexcn_bluelabel_n_int + 0.4 } \l__luatexcn_bluelabel_fs_dim }
      % 单个悬浮盒：白底 + 内框（border）+ 外缘细线（outer-border）；内外框之间的留白由 outer-border-sep 填成白色。
      % （不要拆成「白底盒 + 书名盒」两个悬浮盒：悬浮盒叠放次序不确定，书名会被白底盖住。）
      \tl_set:Nx \l_tmpa_tl
        {
          [
            floating = true,
            x = \dim_use:N \l__luatexcn_bluelabel_x_dim,
            y = \dim_use:N \l__luatexcn_bluelabel_y_dim,
            font-size = \dim_use:N \l__luatexcn_bluelabel_fs_dim,
            grid-height = \dim_use:N \l__luatexcn_bluelabel_fs_dim,
            grid-width = \dim_use:N \l_tmpa_dim,
            height = \dim_use:N \l_tmpb_dim,
            background-color = {255, 255, 255},
            column-align = center,
            border-shape = rect,
            border-width = 0.8pt,
            border-margin = 2pt,
            outer-border = true,
            outer-border-thickness = 0.6pt,
            outer-border-sep = \dim_use:N \l__luatexcn_bluelabel_g_dim,
          ]
        }
      \exp_after:wN \文本框 \l_tmpa_tl {#2}
    \group_end:
  }

% \蓝签小字[x=,y=,font-size=,font-color=,height=]{文字}
% 封面小字（撰者、出版者等），竖排，位置由 x（距页面右边）、y（距页面上边）调节。
\dim_new:N \l__luatexcn_bluetext_x_dim
\dim_new:N \l__luatexcn_bluetext_y_dim
\dim_new:N \l__luatexcn_bluetext_fs_dim
\tl_new:N \l__luatexcn_bluetext_color_tl
\tl_new:N \l__luatexcn_bluetext_height_tl
\keys_define:nn { luatexcn / bluetext }
  {
    x          .dim_set:N = \l__luatexcn_bluetext_x_dim,
    y          .dim_set:N = \l__luatexcn_bluetext_y_dim,
    font-size  .dim_set:N = \l__luatexcn_bluetext_fs_dim,
    font-color .tl_set:N  = \l__luatexcn_bluetext_color_tl,
    height     .tl_set:N  = \l__luatexcn_bluetext_height_tl,
    unknown    .code:n    = { \msg_warning:nnn { luatexcn } { bluelabel-key } {#1} },
  }
\NewDocumentCommand { \蓝签小字 } { O{} m }
  {
    \group_begin:
      \dim_set:Nn \l__luatexcn_bluetext_x_dim { 100mm }
      \dim_set:Nn \l__luatexcn_bluetext_y_dim { 30mm }
      \dim_set:Nn \l__luatexcn_bluetext_fs_dim { 14pt }
      \tl_set:Nn \l__luatexcn_bluetext_color_tl { 255, 255, 255 }
      \tl_clear:N \l__luatexcn_bluetext_height_tl
      \keys_set:nn { luatexcn / bluetext } {#1}
      \int_set:Nn \l__luatexcn_bluelabel_n_int { \tl_count:n {#2} }
      \tl_if_empty:NT \l__luatexcn_bluetext_height_tl
        { \tl_set:Nx \l__luatexcn_bluetext_height_tl { \int_use:N \l__luatexcn_bluelabel_n_int } }
      \tl_set:Nx \l_tmpa_tl
        {
          [
            floating = true,
            x = \dim_use:N \l__luatexcn_bluetext_x_dim,
            y = \dim_use:N \l__luatexcn_bluetext_y_dim,
            font-size = \dim_use:N \l__luatexcn_bluetext_fs_dim,
            grid-height = \dim_use:N \l__luatexcn_bluetext_fs_dim,
            grid-width = \dim_eval:n { 1.3 \l__luatexcn_bluetext_fs_dim },
            height = \l__luatexcn_bluetext_height_tl,
            font-color = { \l__luatexcn_bluetext_color_tl },
          ]
        }
      \exp_after:wN \文本框 \l_tmpa_tl {#2}
    \group_end:
  }
\NewCommandCopy { \BlueLabelTitle } { \蓝签书名 }
\NewCommandCopy { \BlueLabelText } { \蓝签小字 }

\endinput
